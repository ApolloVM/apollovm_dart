name: Dart CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
      - name: Dart version
        run: |
          dart --version
          uname -a
      - name: Install dependencies
        run: dart pub get
      - name: Upgrade dependencies
        run: dart pub upgrade
      - name: dart format
        # Scope to the package's real sources: the `lsp/` companion assets are a
        # nested benchmark package plus example-workspace fixtures written in
        # ApolloVM's language subset, and they ship excluded via `.pubignore`.
        # (The intentionally malformed fixture is `.broken.dart` — dot-prefixed
        # so that a bare `dart format .` skips it too.)
        run: dart format -o none --set-exit-if-changed lib bin test example
      - name: dart analyze
        run: dart analyze --fatal-infos --fatal-warnings .
      - name: dependency_validator
        run: dart run dependency_validator
      - name: dart doc
        run: dart doc --dry-run
      - name: dart pub publish --dry-run
        run: dart pub publish --dry-run

  test_vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
      - name: Dart version
        run: |
          dart --version
          uname -a
      - name: Install dependencies
        run: dart pub get
      - name: Upgrade dependencies
        run: dart pub upgrade
      - name: Run tests (VM)
        # Exclude `wasm-gc` tests: this job uses `wasm_run` (wasmtime 14 /
        # wasmi 0.31), which does not support the WebAssembly GC proposal.
        run: dart test --platform vm --exclude-tags wasm-gc --coverage=./coverage
      - name: Generate coverage report
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage --packages=.dart_tool/package_config.json --report-on=lib --lcov -o ./coverage/lcov.info -i ./coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          directory: ./coverage/
          flags: unittests
          env_vars: OS,DART
          fail_ci_if_error: true
          verbose: true


  test_exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dart-lang/setup-dart@v1
      - name: Dart version
        run: |
          dart --version
          uname -a
      - name: Install dependencies
        run: dart pub get
      - name: Upgrade dependencies
        run: dart pub upgrade
      - name: Run tests (exe)
        # `wasm_run` backend has no WebAssembly GC support; skip `wasm-gc` tests.
        run: dart test --compiler exe --exclude-tags wasm-gc


  test_chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dart-lang/setup-dart@v1
      - name: Dart version
        run: |
          dart --version
          uname -a
      - name: Install dependencies
        run: dart pub get
      - name: Upgrade dependencies
        run: dart pub upgrade
      - name: Run tests (Chrome)
        # Chrome's engine supports the WebAssembly GC proposal (v119+), so it
        # runs ALL tests, including `wasm-gc` ones (unlike the wasm_run-based
        # VM/exe jobs, which exclude that tag).
        run: dart test --platform chrome


  # The `apollovm_wasm/` sub-package: the native (VM) Wasm runtime, published
  # separately so that core `apollovm` stays free of an FFI/Rust toolchain.
  # It resolves `apollovm` from pub.dev, so this job validates it exactly as a
  # consumer would get it.
  apollovm_wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apollovm_wasm
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
      - name: Dart version
        run: |
          dart --version
          uname -a
      - name: Install dependencies
        run: dart pub get
      - name: dart format
        run: dart format -o none --set-exit-if-changed lib test
      - name: dart analyze
        run: dart analyze --fatal-infos --fatal-warnings .
      - name: dart doc
        run: dart doc --dry-run
      - name: Run tests (VM)
        # No `wasm_run:setup` step: since `wasm_run` 0.2 that command is gone and
        # the SDK's build hooks download the native library (into `.dart_tool/lib/`)
        # as part of `dart test`.
        # `wasm_run` (wasmtime 14 / wasmi 0.31) has no WebAssembly GC support.
        run: dart test --platform vm --exclude-tags wasm-gc
      - name: dart pub publish --dry-run
        # Via the release script, which temporarily drops the `/apollovm_wasm/`
        # rule from the root `.pubignore` (it keeps the sub-package out of the
        # `apollovm` archive, but pub reads ignore rules from the repo root, so
        # it would otherwise hide this package from its own publish). Running
        # `dart pub publish --dry-run` directly here fails with "the pubspec is
        # hidden" — so this must NOT be `continue-on-error`, or that failure is
        # exactly what gets swallowed.
        working-directory: .
        run: tool/publish_apollovm_wasm.sh --dry-run
