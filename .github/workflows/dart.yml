name: Dart CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
      - name: Dart version
        run: |
          dart --version
          uname -a
      - name: Install dependencies
        run: dart pub get
      - name: Upgrade dependencies
        run: dart pub upgrade
      - name: dart format
        # Scope to the package's real sources: the `lsp/` companion assets are a
        # nested benchmark package plus example-workspace fixtures written in
        # ApolloVM's language subset (one intentionally malformed), which the
        # Dart formatter cannot parse. They ship excluded via `.pubignore`.
        run: dart format -o none --set-exit-if-changed lib bin test example
      - name: dart analyze
        run: dart analyze --fatal-infos --fatal-warnings .
      - name: dependency_validator
        run: dart run dependency_validator
      - name: dart doc
        run: dart doc --dry-run
      - name: dart pub publish --dry-run
        run: dart pub publish --dry-run

  test_vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
      - name: Dart version
        run: |
          dart --version
          uname -a
      - name: Install dependencies
        run: dart pub get
      - name: Upgrade dependencies
        run: dart pub upgrade
      - name: wasm_run:setup (install dynamic library)
        run: dart run wasm_run:setup
      - name: Run tests (VM)
        # Exclude `wasm-gc` tests: this job uses `wasm_run` (wasmtime 14 /
        # wasmi 0.31), which does not support the WebAssembly GC proposal.
        run: dart test --platform vm --exclude-tags wasm-gc --coverage=./coverage
      - name: Generate coverage report
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage --packages=.dart_tool/package_config.json --report-on=lib --lcov -o ./coverage/lcov.info -i ./coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          directory: ./coverage/
          flags: unittests
          env_vars: OS,DART
          fail_ci_if_error: true
          verbose: true


  test_exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dart-lang/setup-dart@v1
      - name: Dart version
        run: |
          dart --version
          uname -a
      - name: Install dependencies
        run: dart pub get
      - name: Upgrade dependencies
        run: dart pub upgrade
      - name: wasm_run:setup (install dynamic library)
        run: dart run wasm_run:setup
      - name: Run tests (exe)
        # `wasm_run` backend has no WebAssembly GC support; skip `wasm-gc` tests.
        run: dart test --compiler exe --exclude-tags wasm-gc


  test_chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dart-lang/setup-dart@v1
      - name: Dart version
        run: |
          dart --version
          uname -a
      - name: Install dependencies
        run: dart pub get
      - name: Upgrade dependencies
        run: dart pub upgrade
      - name: Run tests (Chrome)
        # Chrome's engine supports the WebAssembly GC proposal (v119+), so it
        # runs ALL tests, including `wasm-gc` ones (unlike the wasm_run-based
        # VM/exe jobs, which exclude that tag).
        run: dart test --platform chrome


  # The `apollovm_wasm/` sub-package: the native (VM) Wasm runtime, published
  # separately so that core `apollovm` stays free of an FFI/Rust toolchain.
  # `pubspec_overrides.yaml` resolves `apollovm` from this checkout, so this job
  # validates the sub-package against the core commit it ships with — not
  # against whatever is on pub.dev.
  apollovm_wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apollovm_wasm
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
      - name: Dart version
        run: |
          dart --version
          uname -a
      - name: Install dependencies
        run: dart pub get
      - name: dart format
        run: dart format -o none --set-exit-if-changed lib test
      - name: dart analyze
        run: dart analyze --fatal-infos --fatal-warnings .
      - name: dart doc
        run: dart doc --dry-run
      - name: wasm_run:setup (install dynamic library)
        run: dart run wasm_run:setup
      - name: Run tests (VM)
        # `wasm_run` (wasmtime 14 / wasmi 0.31) has no WebAssembly GC support.
        run: dart test --platform vm --exclude-tags wasm-gc
      - name: dart pub publish --dry-run
        # Skipped until `apollovm` 2.0.0 is on pub.dev: the dry-run resolves the
        # published `apollovm: ^2.0.0` constraint, ignoring pubspec_overrides.
        continue-on-error: true
        run: dart pub publish --dry-run
