name: apollovm_wasm
description: >-
  Native (Dart VM) WebAssembly execution for ApolloVM: the wasm_run-backed
  WasmRuntime, kept out of the core package so apollovm stays FFI-free.
version: 1.2.1
repository: https://github.com/ApolloVM/apollovm_dart
issue_tracker: https://github.com/ApolloVM/apollovm_dart/issues

topics:
  - vm
  - wasm
  - webassembly
  - compiler

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  # This runtime decodes values the `apollovm` Wasm generator encodes — the
  # boxed-`Object` cell layout and its `_boxTag*` values are a contract between
  # the two. `^2.0.0` allowed pairings that were never built or tested together,
  # so it tracks the release it is cut against.
  apollovm: ^2.25.0
  wasm_run: ^0.2.0+2
  # Held to 2.12.x, not preferred: `wasm_run` 0.2.0+2 ships Rust bindings
  # generated against `flutter_rust_bridge` 2.12.0 but declares `^2.12.0`, so a
  # resolution that picks up 2.13.0 makes every Wasm call die in `RustLib.init`
  # with "codegen version (2.12.0) should be the same as runtime version
  # (2.13.0)". The bridge's generated code must match its runtime exactly, and
  # only its minor version moves, so the upper bound is the next minor. It is
  # declared here rather than in a `dependency_overrides` because an override
  # would not reach consumers of this package. Widen it when `wasm_run`
  # publishes bindings regenerated for a newer bridge.
  flutter_rust_bridge: '>=2.12.0 <2.13.0'
  crypto: ^3.0.7
  path: ^1.9.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
