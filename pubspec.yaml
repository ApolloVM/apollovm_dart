name: apollovm
description: >-
  Portable multi-language VM: parse, run and translate Dart, Java, Kotlin, Go,
  C#, JavaScript, TypeScript, Lua and Python — with on-the-fly Wasm compilation
  and MCP/LSP servers.
version: 2.35.0
repository: https://github.com/ApolloVM/apollovm_dart
issue_tracker: https://github.com/ApolloVM/apollovm_dart/issues

topics:
  - vm
  - dart
  - java
  - compiler
  - translator

screenshots:
  - description: 'ApolloVM Logo'
    path: example/apollovm-logo.png

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  swiss_knife: ^3.3.14
  async_extension: ^1.2.22
  # 1.2.3 or newer is required, not merely preferred: earlier versions decode
  # LEB128 incorrectly on the web, which silently corrupts integer literals in
  # a binary AST image (`4294967296` came back as `0`).
  data_serializer: ^1.2.3
  # Built-in HMAC-SHA256 signing for binary AST files (`HmacSha256Signer`).
  # Pure Dart and web-safe; signing itself is optional and pluggable.
  crypto: ^3.0.8
  petitparser: ^7.1.0
  collection: ^1.19.1
  args: ^2.7.0
  wasm_interop: ^2.0.1
  path: ^1.9.1
  web: ^1.1.2
  dart_mcp: ^0.5.2
  stream_channel: ^2.1.4
  # Optional Dart package importer (`PubDevProvider`) only — all web-safe.
  # The default `PackageConfigProvider` uses none of these.
  http: ^1.6.0
  archive: ^4.6.0
  pub_semver: ^2.2.1
  yaml: ^3.1.4

dev_dependencies:
  # The native (VM) Wasm engine lives outside this package (see `apollovm_wasm`),
  # so the Wasm execution tests pull it back in here.
  apollovm_wasm:
    path: apollovm_wasm
  lints: ^6.1.0
  dependency_validator: ^5.1.0
  test: ^1.33.0
  pubspec: ^2.3.0
  xml: ^6.6.1
  build_web_compilers: ^4.8.12
  build_runner: ^2.16.2

executables:
  apollovm:
